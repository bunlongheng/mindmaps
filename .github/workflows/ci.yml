name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g npm@11 # Node-20-compatible npm that fixes npm/cli#4828 (npm ci skipping optional rollup binary)
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:api
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
