<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Mindmaps</title>
    <meta name="description" content="Visual mind map and diagram tool. Mind map, tree, fishbone layouts with cloud persistence." />
    <meta name="author" content="bunlongheng" />
    <meta name="keywords" content="mindmaps, diagram, mind map, fishbone, tree, visual thinking" />

    <!-- ── Favicon stack ──────────────────────────────── -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- ── Apple / iOS ────────────────────────────────── -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mindmaps" />

    <!-- ── PWA / Android ─────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Windows tile ──────────────────────────────── -->
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="msapplication-TileImage" content="/icons/android-chrome-192x192.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- ── Open Graph ────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mindmaps" />
    <meta property="og:description" content="Visual mind map and diagram tool. Mind map, tree, fishbone layouts." />
    <meta property="og:image" content="/icons/android-chrome-512x512.png" />
    <meta property="og:site_name" content="Mindmaps" />

    <!-- ── Twitter card ──────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mindmaps" />
    <meta name="twitter:description" content="Visual mind map and diagram tool." />
    <meta name="twitter:image" content="/icons/android-chrome-512x512.png" />

    <!-- Fonts are self-hosted via @fontsource/inter (imported in main.tsx) so the
         strict CSP (font-src 'self') is satisfied with no external CDN. -->
  </head>
  <body style="touch-action: manipulation;">
    <div id="root"></div>
    <!-- Safari native pinch/double-tap zoom is blocked from the app bundle (src/App.tsx),
         not an inline script, so the CSP can forbid inline scripts entirely. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
